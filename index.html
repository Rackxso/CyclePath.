<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CylcePath.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="carriles_bici_cordoba.css" />
</head>

<body>

  <header>
    <h1>CylcePath.</h1>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-line" style="background:#1D9E75;"></div>Vía exclusiva
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background:#378ADD;"></div>Carril en calzada
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background:#D85A30;"></div>Acera bici / otro
      </div>
    </div>
  </header>

  <div id="map-container">
    <div id="map"></div>

    <div id="search-float">
      <div class="search-wrap">
        <input type="text" id="city-input" placeholder="Buscar ciudad en el mundo..." autocomplete="off" />
        <button class="search-btn" onclick="doSearch()">Buscar</button>
        <ul id="suggestions"></ul>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <p style="color:#888;">Busca una ciudad para empezar</p>
    </div>

    <div id="route-float">
      <div class="route-card">

        <!-- Origen -->
        <div class="route-row" style="position:relative;">
          <div class="route-dot route-dot-a">A</div>
          <div class="route-input-wrap">
            <input type="text" id="route-origin" placeholder="Origen..." autocomplete="off" />
          </div>
          <ul class="route-sugg" id="sugg-origin" style="top:calc(100% + 6px);"></ul>
        </div>

        <div class="route-divider"></div>

        <!-- Destino -->
        <div class="route-row" style="position:relative;">
          <div class="route-dot route-dot-b">B</div>
          <div class="route-input-wrap">
            <input type="text" id="route-dest" placeholder="Destino..." autocomplete="off" />
          </div>
          <ul class="route-sugg" id="sugg-dest" style="top:calc(100% + 6px);"></ul>
        </div>

        <!-- Botón ir -->
        <div style="display:flex; justify-content:flex-end; padding: 0 2px;">
          <button class="route-go-btn" onclick="doRouteSearch()">
            Calcular ruta
          </button>
          <button class="route-go-btn" id="route-clear-btn" onclick="clearNav()" title="Limpiar ruta"
            style="background:none;color:#aaa;border:none;font-size:18px;padding:0 8px;cursor:pointer;display:none;">✕</button>
        </div>

        <!-- Resultado -->
        <div class="route-result" id="route-result"></div>
      </div>
    </div>
  </div>

  <div id="status-bar">
    <span id="status">Ninguna ciudad seleccionada</span>
    <span>© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors</span>
  </div>

  <script>
      var map, layerGroup, navLayerGroup;

      // --- Navigation state ---
      var navGraph = null;
      var navMode = false;
      var navStep = 0; // 1 = waiting for A, 2 = waiting for B
      var navMarkerA = null, navMarkerB = null;
      var navRouteLine = null;

      // Radius circles shown when no route is found
      var navRadiusCircles = [];
      var NAV_SNAP_RADIUS = 30; // metres — must match RADIUS in buildGraph

      var QUERY_NAME_TPL = [
        '[out:json][timeout:60];',
        'area["name"="{CITY}"]["boundary"="administrative"]["admin_level"~"^[678]$"]->.a;',
        '(',
        '  way["highway"="cycleway"](area.a);',
        '  way["cycleway"~"lane|track|opposite_lane|opposite_track|shared_lane"](area.a);',
        '  way["cycleway:both"~"lane|track"](area.a);',
        '  way["cycleway:left"~"lane|track"](area.a);',
        '  way["cycleway:right"~"lane|track"](area.a);',
        '  way["highway"~"path|footway"]["bicycle"~"designated|yes"](area.a);',
        ');',
        'out geom;'
      ].join('\n');

      var QUERY_BBOX_TPL = [
        '[out:json][timeout:60];',
        '(',
        '  way["highway"="cycleway"]({BBOX});',
        '  way["cycleway"~"lane|track|opposite_lane|opposite_track|shared_lane"]({BBOX});',
        '  way["cycleway:both"~"lane|track"]({BBOX});',
        '  way["cycleway:left"~"lane|track"]({BBOX});',
        '  way["cycleway:right"~"lane|track"]({BBOX});',
        '  way["highway"~"path|footway"]["bicycle"~"designated|yes"]({BBOX});',
        ');',
        'out geom;'
      ].join('\n');

      var MIRRORS = [
        'https://overpass-api.de/api/interpreter',
        'https://overpass.kumi.systems/api/interpreter'
      ];

      function getColor(tags) {
        var hw = tags.highway || '';
        var cw = tags.cycleway || tags['cycleway:both'] || tags['cycleway:left'] || tags['cycleway:right'] || '';
        if (hw === 'cycleway') return '#1D9E75';
        if (cw === 'track' || cw === 'lane') return '#378ADD';
        return '#D85A30';
      }
      function getTagClass(tags) {
        var hw = tags.highway || '';
        var cw = tags.cycleway || tags['cycleway:both'] || '';
        if (hw === 'cycleway') return 'tag-green';
        if (cw === 'track' || cw === 'lane') return 'tag-blue';
        return 'tag-orange';
      }
      function getTypeName(tags) {
        var hw = tags.highway || '';
        var cw = tags.cycleway || tags['cycleway:both'] || tags['cycleway:left'] || tags['cycleway:right'] || '';
        if (hw === 'cycleway') return 'Vía ciclista exclusiva';
        if (cw === 'track') return 'Pista bici segregada';
        if (cw === 'lane') return 'Carril bici en calzada';
        if (cw === 'shared_lane') return 'Carril compartido';
        return 'Acera bici / vía compartida';
      }

      function setOverlay(msg) {
        var o = document.getElementById('overlay');
        o.style.display = 'flex';
        o.innerHTML = '<div class="spinner"></div><p>' + msg + '</p>';
      }
      function hideOverlay() {
        document.getElementById('overlay').style.display = 'none';
      }
      function showError(msg) {
        var o = document.getElementById('overlay');
        o.style.display = 'flex';
        o.innerHTML = '<div class="error-box"><p>' + msg + '</p></div>';
      }

      function renderData(data, cityName) {
        layerGroup.clearLayers();
        var elements = data.elements || [];
        var count = 0;
        var bounds = [];
        elements.forEach(function (el) {
          if (el.type !== 'way' || !el.geometry) return;
          var latlngs = el.geometry.map(function (p) { return [p.lat, p.lon]; });
          var tags = el.tags || {};
          var cw = tags.cycleway || tags['cycleway:both'] || '';
          var opts = {
            color: getColor(tags),
            weight: tags.highway === 'cycleway' ? 4 : 3,
            opacity: 0.85
          };
          if (cw === 'shared_lane') opts.dashArray = '6,4';
          var line = L.polyline(latlngs, opts).addTo(layerGroup);
          var name = tags.name ? '<b>' + tags.name + '</b>' : '<b>Tramo sin nombre</b>';
          var surface = tags.surface ? '<span>Superficie: ' + tags.surface + '</span>' : '';
          line.bindPopup(name + '<span class="tag ' + getTagClass(tags) + '">' + getTypeName(tags) + '</span>' + surface);
          latlngs.forEach(function (p) { bounds.push(p); });
          count++;
        });

        if (bounds.length > 0) map.fitBounds(bounds, { padding: [30, 30] });
        hideOverlay();

        // Build routing graph from downloaded data
        clearNav();
        navGraph = elements.length > 0 ? buildGraph(elements) : null;

        if (count === 0) {
          document.getElementById('status').textContent = 'Sin datos de carriles bici en ' + cityName + ' (o ciudad no encontrada)';
          showError('No se encontraron carriles bici en <b>' + cityName + '</b>.<br><br>Prueba con el nombre oficial de la ciudad o una ciudad más grande.');
        } else {
          document.getElementById('status').textContent = count + ' tramos encontrados en ' + cityName;
        }
      }

      function tryMirror(mirrors, idx, query, cityName) {
        if (idx >= mirrors.length) {
          showError('No se pudo conectar con Overpass API.<br><br>Si abres el archivo como <code>file://</code>, usa un servidor local:<br><code>python3 -m http.server 8080</code>');
          document.getElementById('status').textContent = 'Error de conexión';
          return;
        }
        setOverlay('Cargando carriles bici de ' + cityName + '...');
        fetch(mirrors[idx], {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(query)
        })
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(function (data) {
            renderData(data, cityName);
          })
          .catch(function () {
            tryMirror(mirrors, idx + 1, query, cityName);
          });
      }

      function loadCity(cityName, bbox) {
        var query;
        if (bbox) {
          // Nominatim bbox: [south, north, west, east] → Overpass: south,west,north,east
          var bboxStr = bbox[0] + ',' + bbox[2] + ',' + bbox[1] + ',' + bbox[3];
          query = QUERY_BBOX_TPL.replace(/\{BBOX\}/g, bboxStr);
          map.fitBounds([
            [parseFloat(bbox[0]), parseFloat(bbox[2])],
            [parseFloat(bbox[1]), parseFloat(bbox[3])]
          ], { padding: [20, 20], animate: true });
        } else {
          query = QUERY_NAME_TPL.replace('{CITY}', cityName);
        }
        document.getElementById('status').textContent = 'Buscando ' + cityName + '...';
        tryMirror(MIRRORS, 0, query, cityName);
      }

      // Autocomplete with Nominatim (worldwide)
      var suggestTimeout;
      var cityInput = document.getElementById('city-input');
      var suggestionsEl = document.getElementById('suggestions');
      var activeSuggIdx = -1;

      cityInput.addEventListener('input', function () {
        clearTimeout(suggestTimeout);
        var val = cityInput.value.trim();
        if (val.length < 3) { suggestionsEl.style.display = 'none'; return; }
        suggestTimeout = setTimeout(function () { fetchSuggestions(val); }, 300);
      });

      cityInput.addEventListener('keydown', function (e) {
        var items = suggestionsEl.querySelectorAll('li');
        if (e.key === 'ArrowDown') {
          activeSuggIdx = Math.min(activeSuggIdx + 1, items.length - 1);
          updateActive(items);
          e.preventDefault();
        } else if (e.key === 'ArrowUp') {
          activeSuggIdx = Math.max(activeSuggIdx - 1, -1);
          updateActive(items);
          e.preventDefault();
        } else if (e.key === 'Enter') {
          if (activeSuggIdx >= 0 && items[activeSuggIdx]) {
            items[activeSuggIdx].click();
          } else {
            doSearch();
          }
        } else if (e.key === 'Escape') {
          suggestionsEl.style.display = 'none';
          activeSuggIdx = -1;
        }
      });

      function updateActive(items) {
        items.forEach(function (li, i) {
          li.classList.toggle('active', i === activeSuggIdx);
        });
      }

      document.addEventListener('click', function (e) {
        if (!e.target.closest('#search-float')) {
          suggestionsEl.style.display = 'none';
          activeSuggIdx = -1;
        }
      });

      function fetchSuggestions(val) {
        var url = 'https://nominatim.openstreetmap.org/search'
          + '?q=' + encodeURIComponent(val)
          + '&featureType=city'
          + '&format=json'
          + '&limit=8'
          + '&accept-language=es'
          + '&addressdetails=1';

        fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (results) {
            activeSuggIdx = -1;
            suggestionsEl.innerHTML = '';
            if (!results.length) { suggestionsEl.style.display = 'none'; return; }
            results.forEach(function (r) {
              var li = document.createElement('li');
              var cityName = r.name || r.display_name.split(',')[0].trim();
              var addr = r.address || {};
              var country = addr.country || '';
              var region = addr.state || addr.county || addr.region || '';
              var detail = [region, country].filter(Boolean).join(', ');

              li.innerHTML =
                '<span class="sugg-text">' +
                '<span class="sugg-name">' + cityName + '</span>' +
                (detail ? '<span class="sugg-detail">' + detail + '</span>' : '') +
                '</span>';

              li.addEventListener('click', function () {
                cityInput.value = cityName;
                suggestionsEl.style.display = 'none';
                activeSuggIdx = -1;
                loadCity(cityName, r.boundingbox);
              });
              suggestionsEl.appendChild(li);
            });
            suggestionsEl.style.display = 'block';
          })
          .catch(function () { suggestionsEl.style.display = 'none'; });
      }

      function doSearch() {
        var val = cityInput.value.trim();
        if (!val) return;
        suggestionsEl.style.display = 'none';
        activeSuggIdx = -1;
        loadCity(val, null);
      }

      function initMap() {
        map = L.map('map', { zoomControl: true }).setView([40.0, -3.7], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors',
          maxZoom: 19
        }).addTo(map);
        layerGroup = L.layerGroup().addTo(map);
        navLayerGroup = L.layerGroup().addTo(map);

        map.on('click', onMapClick);

        setupRouteInput('route-origin', 'sugg-origin');
        setupRouteInput('route-dest',   'sugg-dest');

        cityInput.value = 'Córdoba';
        loadCity('Córdoba', null);
      }

      // ─── Graph / routing ────────────────────────────────────────────────────────

      function haversine(a, b) {
        var R = 6371000;
        var dLat = (b[0] - a[0]) * Math.PI / 180;
        var dLon = (b[1] - a[1]) * Math.PI / 180;
        var lat1 = a[0] * Math.PI / 180;
        var lat2 = b[0] * Math.PI / 180;
        var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.sin(dLon / 2) * Math.sin(dLon / 2) * Math.cos(lat1) * Math.cos(lat2);
        return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
      }

      // Simple binary min-heap keyed on .f
      class MinHeap {
        constructor() { this.d = []; }
        push(item) {
          this.d.push(item);
          var i = this.d.length - 1;
          while (i > 0) {
            var p = (i - 1) >> 1;
            if (this.d[p].f <= this.d[i].f) break;
            var t = this.d[p]; this.d[p] = this.d[i]; this.d[i] = t;
            i = p;
          }
        }
        pop() {
          var top = this.d[0], last = this.d.pop();
          if (this.d.length > 0) {
            this.d[0] = last;
            var i = 0, n = this.d.length;
            while (true) {
              var l = 2 * i + 1, r = 2 * i + 2, s = i;
              if (l < n && this.d[l].f < this.d[s].f) s = l;
              if (r < n && this.d[r].f < this.d[s].f) s = r;
              if (s === i) break;
              var t = this.d[s]; this.d[s] = this.d[i]; this.d[i] = t;
              i = s;
            }
          }
          return top;
        }
        size() { return this.d.length; }
      }

      function buildGraph(elements) {
        var nodes = [];
        var nodeIndex = {};
        var adj = [];
        var CELL = 0.0005; // ~55 m grid cells
        var grid = {};

        function gk(lat, lon) {
          return Math.floor(lat / CELL) + ',' + Math.floor(lon / CELL);
        }
        function addNode(lat, lon) {
          var key = lat.toFixed(6) + ',' + lon.toFixed(6);
          if (nodeIndex[key] !== undefined) return nodeIndex[key];
          var idx = nodes.length;
          nodes.push([lat, lon]);
          adj.push([]);
          nodeIndex[key] = idx;
          var k = gk(lat, lon);
          if (!grid[k]) grid[k] = [];
          grid[k].push(idx);
          return idx;
        }
        function addEdge(i, j) {
          var d = haversine(nodes[i], nodes[j]);
          adj[i].push({ to: j, dist: d });
          adj[j].push({ to: i, dist: d });
        }

        // Add way edges
        elements.forEach(function (el) {
          if (el.type !== 'way' || !el.geometry) return;
          var prev = -1;
          el.geometry.forEach(function (p) {
            var idx = addNode(p.lat, p.lon);
            if (prev >= 0) addEdge(prev, idx);
            prev = idx;
          });
        });

        // Connect nodes within 30 m across different ways
        var RADIUS = NAV_SNAP_RADIUS;
        nodes.forEach(function (node, i) {
          var cx = Math.floor(node[0] / CELL);
          var cy = Math.floor(node[1] / CELL);
          for (var dx = -1; dx <= 1; dx++) {
            for (var dy = -1; dy <= 1; dy++) {
              var k = (cx + dx) + ',' + (cy + dy);
              if (!grid[k]) continue;
              grid[k].forEach(function (j) {
                if (j <= i) return;
                if (haversine(node, nodes[j]) <= RADIUS) {
                  if (!adj[i].some(function (e) { return e.to === j; })) addEdge(i, j);
                }
              });
            }
          }
        });

        // Collect terminal nodes: degree 1 (dead-ends, real open endpoints of tracks)
        var terminalNodes = [];
        for (var i = 0; i < nodes.length; i++) {
          if (adj[i].length === 1) terminalNodes.push(i);
        }

        return { nodes: nodes, adj: adj, grid: grid, CELL: CELL, terminalNodes: terminalNodes };
      }

      function nearestNode(graph, lat, lon) {
        var best = -1, bestDist = Infinity;
        var pt = [lat, lon];
        var CELL = graph.CELL;
        var cx = Math.floor(lat / CELL), cy = Math.floor(lon / CELL);
        for (var r = 0; r <= 8; r++) {
          for (var dx = -r; dx <= r; dx++) {
            for (var dy = -r; dy <= r; dy++) {
              if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
              var k = (cx + dx) + ',' + (cy + dy);
              if (!graph.grid[k]) continue;
              graph.grid[k].forEach(function (idx) {
                var d = haversine(pt, graph.nodes[idx]);
                if (d < bestDist) { bestDist = d; best = idx; }
              });
            }
          }
          if (best >= 0 && bestDist < (r + 1) * CELL * 111000) break;
        }
        return best;
      }

      function astarRoute(graph, startIdx, endIdx) {
        var nodes = graph.nodes, adj = graph.adj, n = nodes.length;
        var dist = new Float64Array(n).fill(Infinity);
        var prev = new Int32Array(n).fill(-1);
        var visited = new Uint8Array(n);
        var goal = nodes[endIdx];
        var heap = new MinHeap();
        dist[startIdx] = 0;
        heap.push({ idx: startIdx, f: 0 });

        while (heap.size() > 0) {
          var cur = heap.pop();
          var u = cur.idx;
          if (visited[u]) continue;
          visited[u] = 1;
          if (u === endIdx) break;
          var edges = adj[u];
          for (var i = 0; i < edges.length; i++) {
            var v = edges[i].to;
            if (visited[v]) continue;
            var nd = dist[u] + edges[i].dist;
            if (nd < dist[v]) {
              dist[v] = nd;
              prev[v] = u;
              heap.push({ idx: v, f: nd + haversine(nodes[v], goal) });
            }
          }
        }

        if (dist[endIdx] === Infinity) return null;
        var path = [];
        for (var c = endIdx; c !== -1; c = prev[c]) path.unshift(c);
        return { path: path, dist: dist[endIdx] };
      }

      // ─── Navigation UI ──────────────────────────────────────────────────────────

      function makeNavIcon(label, color) {
        return L.divIcon({
          className: '',
          html: '<div style="width:28px;height:28px;border-radius:50%;background:' + color + ';color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3)">' + label + '</div>',
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });
      }

      // toggleNav now just enables/disables map-click mode (kept for header button)
      function toggleNav() {
        navMode = !navMode;
        var btn = document.getElementById('nav-btn');
        if (navMode) {
          btn.classList.add('active');
          map.getContainer().style.cursor = 'crosshair';
        } else {
          clearNav();
        }
      }

      function clearRadiusCircles() {
        navRadiusCircles.forEach(function (c) { navLayerGroup.removeLayer(c); });
        navRadiusCircles = [];
      }

      function clearNavMarkers() {
        if (navMarkerA) { navLayerGroup.removeLayer(navMarkerA); navMarkerA = null; }
        if (navMarkerB) { navLayerGroup.removeLayer(navMarkerB); navMarkerB = null; }
        if (navRouteLine) { navLayerGroup.removeLayer(navRouteLine); navRouteLine = null; }
        clearRadiusCircles();
      }

      function clearNav() {
        navMode = false;
        navStep = 0;
        clearNavMarkers();
        map.getContainer().style.cursor = '';
        document.getElementById('nav-btn').classList.remove('active');
        document.getElementById('route-result').style.display = 'none';
        document.getElementById('route-result').innerHTML = '';
        document.getElementById('route-clear-btn').style.display = 'none';
      }

      function setRouteResult(html) {
        var el = document.getElementById('route-result');
        el.innerHTML = html;
        el.style.display = html ? 'block' : 'none';
        document.getElementById('route-clear-btn').style.display = html ? 'inline-flex' : 'none';
      }

      // Map click: fill whichever input is empty/focused
      function onMapClick(e) {
        if (!navMode) return;
        var lat = e.latlng.lat, lon = e.latlng.lng;
        var originInput = document.getElementById('route-origin');
        var destInput   = document.getElementById('route-dest');

        // Reverse-geocode to get a label
        fetch('https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lon + '&format=json&accept-language=es')
          .then(function(r){ return r.json(); })
          .then(function(data){
            var label = data.display_name ? data.display_name.split(',').slice(0,2).join(',').trim() : (lat.toFixed(5)+', '+lon.toFixed(5));
            if (!originInput.value || document.activeElement === originInput) {
              originInput.value = label;
              originInput._latlng = { lat: lat, lng: lon };
              if (!destInput.value) destInput.focus();
            } else {
              destInput.value = label;
              destInput._latlng = { lat: lat, lng: lon };
            }
          })
          .catch(function(){
            var label = lat.toFixed(5) + ', ' + lon.toFixed(5);
            if (!originInput.value) { originInput.value = label; originInput._latlng = { lat: lat, lng: lon }; }
            else { destInput.value = label; destInput._latlng = { lat: lat, lng: lon }; }
          });
      }

      // ─── Route autocomplete ──────────────────────────────────────────────────────

      function setupRouteInput(inputId, suggId) {
        var input = document.getElementById(inputId);
        var sugg  = document.getElementById(suggId);
        var timer;

        input.addEventListener('input', function() {
          clearTimeout(timer);
          input._latlng = null; // clear cached coord when user types
          var val = input.value.trim();
          if (val.length < 3) { sugg.style.display = 'none'; return; }
          timer = setTimeout(function() { fetchRouteSugg(val, input, sugg); }, 300);
        });

        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') { sugg.style.display = 'none'; doRouteSearch(); }
          if (e.key === 'Escape') { sugg.style.display = 'none'; }
        });

        document.addEventListener('click', function(e) {
          if (!e.target.closest('#route-float')) sugg.style.display = 'none';
        });
      }

      function fetchRouteSugg(val, input, sugg) {
        var url = 'https://nominatim.openstreetmap.org/search'
          + '?q=' + encodeURIComponent(val)
          + '&format=json&limit=5&accept-language=es&addressdetails=1';
        fetch(url)
          .then(function(r){ return r.json(); })
          .then(function(results){
            sugg.innerHTML = '';
            if (!results.length) { sugg.style.display = 'none'; return; }
            results.forEach(function(r) {
              var li = document.createElement('li');
              var name = r.display_name.split(',').slice(0, 2).join(', ');
              li.innerHTML = '<span>' + name + '</span>';
              li.addEventListener('click', function() {
                input.value = name;
                input._latlng = { lat: parseFloat(r.lat), lng: parseFloat(r.lon) };
                sugg.style.display = 'none';
              });
              sugg.appendChild(li);
            });
            sugg.style.display = 'block';
          })
          .catch(function(){ sugg.style.display = 'none'; });
      }

      // ─── Main route search ───────────────────────────────────────────────────────

      function resolveInput(input, callback) {
        // If we already have a cached latlng (from suggestion or map click) use it
        if (input._latlng) { callback(input._latlng); return; }
        // Otherwise geocode the text
        var val = input.value.trim();
        if (!val) { callback(null); return; }
        fetch('https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(val) + '&format=json&limit=1')
          .then(function(r){ return r.json(); })
          .then(function(res){
            if (!res.length) { callback(null); return; }
            callback({ lat: parseFloat(res[0].lat), lng: parseFloat(res[0].lon) });
          })
          .catch(function(){ callback(null); });
      }

      function doRouteSearch() {
        var originInput = document.getElementById('route-origin');
        var destInput   = document.getElementById('route-dest');
        if (!originInput.value.trim() || !destInput.value.trim()) {
          setRouteResult('Introduce origen y destino.');
          return;
        }
        setRouteResult('Buscando ruta...');
        resolveInput(originInput, function(llA) {
          if (!llA) { setRouteResult('No se encontró el origen.'); return; }
          resolveInput(destInput, function(llB) {
            if (!llB) { setRouteResult('No se encontró el destino.'); return; }
            computeRoute(llA, llB);
          });
        });
      }

      // ─── Drawing & routing ───────────────────────────────────────────────────────

      function drawRadiusCircles(idxA, idxB) {
        clearRadiusCircles();
        if (!navGraph || !navGraph.terminalNodes) return;

        var nodes = navGraph.nodes;
        var nodeA = nodes[idxA];
        var nodeB = nodes[idxB];

        var PAD = 0.015;
        var minLat = Math.min(nodeA[0], nodeB[0]) - PAD;
        var maxLat = Math.max(nodeA[0], nodeB[0]) + PAD;
        var minLon = Math.min(nodeA[1], nodeB[1]) - PAD;
        var maxLon = Math.max(nodeA[1], nodeB[1]) + PAD;

        var circleStyle = {
          radius: NAV_SNAP_RADIUS,
          color: '#7B2FF7',
          weight: 2,
          opacity: 0.85,
          fillColor: '#7B2FF7',
          fillOpacity: 0.12,
          dashArray: '5, 4'
        };

        navGraph.terminalNodes.forEach(function (idx) {
          var n = nodes[idx];
          if (n[0] < minLat || n[0] > maxLat || n[1] < minLon || n[1] > maxLon) return;
          var c = L.circle([n[0], n[1]], circleStyle).addTo(navLayerGroup);
          navRadiusCircles.push(c);
        });
      }

      function computeRoute(latlngA, latlngB) {
        clearNavMarkers();

        // Place markers
        navMarkerA = L.marker([latlngA.lat, latlngA.lng], { icon: makeNavIcon('A', '#1D9E75') }).addTo(navLayerGroup);
        navMarkerB = L.marker([latlngB.lat, latlngB.lng], { icon: makeNavIcon('B', '#D85A30') }).addTo(navLayerGroup);

        var markerBounds = [[latlngA.lat, latlngA.lng], [latlngB.lat, latlngB.lng]];

        if (!navGraph) {
          map.fitBounds(markerBounds, { padding: [60, 60] });
          setRouteResult('Carga una ciudad primero.');
          return;
        }

        var idxA = nearestNode(navGraph, latlngA.lat, latlngA.lng);
        var idxB = nearestNode(navGraph, latlngB.lat, latlngB.lng);

        if (idxA < 0 || idxB < 0) {
          map.fitBounds(markerBounds, { padding: [60, 60] });
          setRouteResult('No hay carriles bici cerca del punto seleccionado.');
          return;
        }
        if (idxA === idxB) {
          map.fitBounds(markerBounds, { padding: [60, 60] });
          setRouteResult('Origen y destino están en el mismo tramo.');
          return;
        }

        var result = astarRoute(navGraph, idxA, idxB);

        if (!result) {
          map.fitBounds(markerBounds, { padding: [60, 60] });
          drawRadiusCircles(idxA, idxB);
          setRouteResult(
            'Sin conexión entre tramos. Huecos &gt;' + NAV_SNAP_RADIUS + ' m en la red.'
            + '<br><span style="color:#7B2FF7;font-size:12px;">Círculos morados = extremos de carril (radio ' + NAV_SNAP_RADIUS + ' m)</span>'
          );
          return;
        }

        clearRadiusCircles();
        var latlngs = result.path.map(function (i) { return navGraph.nodes[i]; });
        navRouteLine = L.polyline(latlngs, { color: '#7B2FF7', weight: 5, opacity: 0.9 }).addTo(navLayerGroup);
        map.fitBounds(navRouteLine.getBounds(), { padding: [40, 40] });

        var km  = (result.dist / 1000).toFixed(2);
        var min = Math.ceil(result.dist / 1000 / 15 * 60);
        setRouteResult('<strong>' + km + ' km</strong> &nbsp;·&nbsp; ~<strong>' + min + ' min</strong> en bici');
      }

    </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
    onload="initMap()"
    onerror="showError('No se pudo cargar Leaflet.')"></script>
